name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generate the Android project, then drop in the game code.
      - name: Create Flutter project
        run: flutter create --org com.example --project-name ludo_master app

      - name: Copy game code
        run: cp main.dart app/lib/main.dart

      - name: Build APK
        run: flutter build apk --release
        working-directory: app

      - uses: actions/upload-artifact@v4
        with:
          name: ludo-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
